name: Import verified Fluxweave source
on:
  push:
    branches: [main]
    paths: ['.bootstrap/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fluxweave-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and extract source archive
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, subprocess, tarfile
          parts = [pathlib.Path(f'.bootstrap/source.part{i:02d}').read_bytes() for i in range(1, 8)]
          # Correct a known one-character base64 transport insertion before verification.
          encoded = base64.b64encode(parts[0]).decode('ascii')
          assert encoded.count('E3OpVJJDX') == 1
          parts[0] = base64.b64decode(encoded.replace('E3OpVJJDX', 'E3OpVJDX', 1) + 'E', validate=True)
          compressed = b''.join(parts)
          assert len(compressed) == 83187
          assert hashlib.sha256(compressed).hexdigest() == 'ac628d164d1be846ddf5e370332d6371a5a1847478261d025ba43472fc3f9e34'
          script = "process.stdout.write(require('node:zlib').brotliDecompressSync(require('node:fs').readFileSync(0)))"
          raw = subprocess.run(['node', '-e', script], input=compressed, stdout=subprocess.PIPE, check=True).stdout
          assert hashlib.sha256(raw).hexdigest() == '6c92e6057037f123d45977bd8792cf1c10a8fd250f1dca4f1647fbb85d42a108'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
              members = archive.getmembers()
              assert len(members) == 37
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ('.git', '.github', '.bootstrap')
              archive.extractall('.', filter='data')
          print('Verified archive SHA256 and extracted all 37 source files.')
          PY
      - name: Test and verify deployment package
        run: |
          npm test
          npm run build:pages
      - name: Commit readable source and remove transport archive
        run: |
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Fluxweave WebGPU workstation source, examples, tests and documentation'
          git push origin HEAD:main
          echo "Imported source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
